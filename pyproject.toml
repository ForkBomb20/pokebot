[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pokebot"
version = "0.2.0"
description = "A Discord bot for Pokémon data"
authors = [
    { name="Nathan Kawamoto", email="njkawamoto@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.3.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "table2ascii>=1.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "aioresponses",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
